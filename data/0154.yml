illustration: "Ми не проти допомогти вам із проєктом."
cefr_level: A2
definitions:
  - ukrainian: |
       Конструкція виражає ставлення [учасника]Participant до здійснення ним певної [дії]Action. Учасник підтримує дію, погоджується її виконати, його ставлення є позитивним, але досить поміркованим.
  - english: |
       The construction expresses the [participant]Participant’s attitude toward performing a certain [action]Action. The participant supports the action, agrees to carry it out, and their attitude is positive but rather moderate.
  - russian: |
       Конструкция выражает отношение [участника]Participant к совершению им некоторого [действия]Action. Участник поддерживает действие, согласен его выполнить, его отношение положительное, но достаточно умеренное.
