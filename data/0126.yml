definitions:
  - ukrainian: |
       Конструкція означає, що [учасник]Agent [говорить або діє]Action від імені [людини, групи людей або організації]Counteragent, за їхнім дорученням або за їхньою згодою.
  - english: |
       The construction indicates that the [participant]Agent [speaks or acts]Action on behalf of a [person, group of people or an organization]Counteragent, by their authorization or with their consent.
  - russian: |
       Конструкция обозначает, что [участник]Agent [говорит или действует]Action вместо [человека, группы людей или организации]Counteragent, по их поручению или с их согласия.
