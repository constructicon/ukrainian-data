name: "згідно з/зі NP-Inst/згідно NP-Gen Cl"
illustration: "Згідно зі звітом, ситуація на ринку стабілізується."
cefr_level: A2
definitions:
  - ukrainian: |
       Конструкція використовується для позначення того, що певна [ситуація]Situation ґрунтується на певному [джерелі]Source або відповідає йому, наприклад закону, документу, плану чи інструкції.
  - english: |
       The construction is used to indicate that a ceratain [situation]Situation is based on or corresponds to a particular [source]Source, such as a law, document, plan, or instruction.
  - russian: |
       Конструкция используется для обозначения того, что определённая [ситуация]Situation основана на определённом [источнике]Source или соответствует ему, например закону, документу, плану или инструкции.
examples:
  - |
       Згідно з [вчорашнім опитуванням громадської думки]Source, [полякам це рішення сподобалося]Situation.
  - |
       Згідно з [норвезьким законодавством]Source, [ув'язнені мають право отримувати вищу освіту]Situation.
  - |
       Згідно з [попереднім дослідженням вчених]Source, [гробниці датуються кінцем IV — II століттям до нашої ери]Situation.
  - |
       Згідно з [дослідженням]Source, [такі цінності, як свобода, гідність, справедливість і рівність для українців важливі]Situation.
  - |
       [Всі виконують умови карантину]Situation згідно [існуючих рекомендацій]Source.
