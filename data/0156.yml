name: "все ще VP"
illustration: "Компанія все ще шукає інвесторів для реалізації нового проєкту."
cefr_level: A2
definitions:
  - ukrainian: |
       Конструкція означає тривалу [дію]Action, яка почалася в минулому. Очікувалося, що ця дія мала закінчитися, але вона триває.
  - english: |
       The construction indicates an ongoing [action]Action that started in the past. It was expected that this action would have ended, but it is still continuing.
  - russian: |
       Конструкция обозначает продолжительное [действие]Action, которое началось в прошлом. Ожидалось, что это действие должно было закончиться, но оно продолжается.
examples:
  - |
       Він усе ще [сподівається знайти документи]Action, які зникли під час переїзду.
  - |
