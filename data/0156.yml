  - |
       Пацієнт усе ще [перебуває під наглядом лікарів після складної операції]Action.
  - |
       Я все ще [пам’ятаю нашу першу зустріч у Києві багато років тому]Action.
  - |
       Уряд усе ще [розглядає кілька варіантів реформування податкової системи]Action.
