definitions:
  - ukrainian: |
       Конструкція позначає, що [мовець]Experiencer сприймає певний [об’єкт, діяльність або ситуацію]Theme як приємний, бажаний або такий, що викликає схвалення.
  - english: |
       The construction indicates that the [speaker] Experiencer perceives a certain [object, activity, or situation] Theme as pleasant, desirable, or as something that elicits approval.
  - russian: |
       Конструкция обозначает, что [говорящий] Experiencer воспринимает определённый [объект, деятельность или ситуацию] Theme как приятный, желательный или вызывающий одобрение.
