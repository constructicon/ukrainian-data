name: "не дуже/не надто ХР"
illustration: "Я не дуже добре підготувалася."
cefr_level: A1
definitions:
  - ukrainian: |
       Конструкція вказує на те, що [ознака]Property або [дія]Action проявляється не в повній мірі/меншою мірою.
  - english: |
       The construction indicates that a [property]Property or an [action]Action is manifested not fully/to a lesser degree.
  - russian: |
       Конструкция указывает на то, что [признак]Property или [действие]Action проявляется не в полной мере/в меньшей степени.
examples:
  - |
       Виблискував сніг, було не дуже [темно]Property.
  - |
       Вигляд у них був не надто [веселий]Property.
  - |
       Моя творчість теж не надто [мала успіх]Action.
  - |
       Проект для Києва не дуже [дорогий]Property - кілька мільярдів гривень.
  - |
       Є вітчизняний препарат, але його українські діабетики не дуже [хочуть купувати]Action.
