cefr_level: A1
definitions:
  - ukrainian: |
       Конструкція використовується для позначення спільної [дії]Action, яку виконує певний [учасник або група учасників]Agent разом з іншим [учасником або групою учасників]Associated. Учасники рівною мірою беруть участь у здійсненні дії.
  - english: |
       The construction is used to denote a joint [action]Action performed by a certain [participant or group of participants]Agent together with another [participant or group of participants]Associated. The participants equally take part in carrying out the action.
  - russian: |
       Конструкция используется для обозначения совместного [действия]Action, которое выполняет некоторый [участник или группа участников]Agent вместе с другим [участником или группой участников]Associated. Участники в равной степени участвуют в осуществлении действия.
examples:
