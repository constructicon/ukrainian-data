  - ukrainian: |
       Конструкція передає [зміст висловлювання, думки або повідомлення]ContentOfSpeech, що приписується вказаному [джерелу]Source, при цьому мовцем не береться відповідальність за істинність повідомлюваного, а лише здійснюється посилання на джерело інформації.
