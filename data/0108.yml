name: "(NP-Dat) Cop можна VP-Inf"
illustration: "Тут можна фотографувати."
cefr_level: A1
definitions:
  - ukrainian: |
       Конструкція використовується для вираження можливості, дозволу або допустимості виконання певної [дії або ситуації]Theme. Конструкція показує, що виконання цієї дії дозволяється, допускається або вважається можливим у певних умовах.
  - english: |
       The construction is used to express the possibility, permission, or acceptability of performing a certain [action or situation]Theme. The construction indicates that performing the action is allowed, permitted, or considered possible under certain conditions.
  - russian: |
       Конструкция используется для выражения возможности, разрешения или допустимости выполнения определённого [действия или ситуации]Theme. Конструкция показывает, что выполнение этого действия разрешается, допускается или считается возможным при определённых условиях.
examples:
