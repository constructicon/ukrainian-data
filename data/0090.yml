name: "VP-Fut, Imp наступного разу"
illustration: "Наступного разу я знайду його!"
cefr_level: A2
definitions:
  - ukrainian: |
       Конструкція використовується для позначення [майбутньої ситуації]Action у зв’язку з попереднім досвідом; акцент робиться на тому, що наступного разу розвиток подій очікується або уявляється інакшим.
  - english: |
       The construction is used to refer to [a future situation]Action in connection with a previous experience; the emphasis is on the expectation or assumption that things will be different next time. It may also just communicate plans.
  - russian: |
       Конструкция используется для обозначения [будущей ситуации]Action в связи с предыдущим опытом; акцент делается на ожидании или предположении, что в следующий раз ход событий будет иным.
examples:
