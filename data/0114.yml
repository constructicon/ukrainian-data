definitions:
  - ukrainian: |
       Конструкція використовується для вираження вимоги, наміру або рішення виконати певну [дію]Action негайно. Конструкція часто підкреслює терміновість, наполегливість або наказовість виконання.
  - english: |
       The construction is used to express a demand, intention, or decision to perform a certain [action]Action immediately. The construction often emphasizes urgency, insistence, or the imperative nature of carrying out the action.
  - russian: |
       Конструкция используется для выражения требования, намерения или решения выполнить определённое [действие]Action немедленно. Конструкция часто подчёркивает срочность, настойчивость или приказной характер выполнения действия.
