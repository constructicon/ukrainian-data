name: "NP-Nom ось-ось VP-Pfv.Fut"
illustration: "Театр ось-ось відкриється."
cefr_level: А2
definitions:
  - ukrainian: |
       Конструкція позначає, що деяка [подія]Event відбудеться в найближчому майбутньому, дуже скоро після моменту мовлення.
  - english: |
       The construction indicates that a certain [event]Event will occur in the very near future, very soon after the moment of speaking.
  - russian: |
       Конструкция обозначает, что некоторое [событие]Event произойдет в самом ближайшем будущем, очень скоро после моментa речи.
examples:
  - |
       [Він]Agent ось-ось [скаже]Event щось важливе, я ж бачу по ньому — не перебивай.
  - |
       [Вона]Agent ось-ось [розплачеться]Event, ти що, не бачиш? Краще зміни тему.
  - |
       [Дитина]Agent, виснажена довгою дорогою, ось-ось [засне]Event просто в матері на руках.
  - |
       [Літак]Agent, що вже кілька хвилин кружляє над аеропортом, ось-ось [приземлиться]Event.
  - |
       Обережно зі склянкою, [вона]Agent ось-ось [впаде]Event з того краю столу!
