record: 76
name: "ось чому CI"
illustration: "Ось чому він пішов."
cefr_level: A1
definitions:
  - ukrainian: |
       Kонструкція використовується, щоб пояснити або підсумувати ситуацію, яка випливає з того, що сталося або було сказано раніше. Підрядна клауза після «ось чому» описує [ситуацію, причину або результат]Situation.
  - english: |
       The construction is used to explain or summarize a situation that follows from something that happened or was said earlier. The clause after “ось чому” describes the [situation, reason, or resultSituation.
  - russian: |
       Конструкция используется, чтобы объяснить или подвести итог ситуации, которая следует из того, что произошло или было сказано ранее. Придаточная часть после «ось чому» описывает [ситуацию, причину или результат]Situation.
examples:
  - |
       Так чи інакше, перерва послужить своїй меті. Ось чому [під час відпустки я люблю годинами читати]Situation.
  - |
       Чесно кажучи, я вірю в те, що в житті не буває випадковостей. Ось чому [мені здається, що наша з Олегом історія почалася задовго до його появи на моєму шляху]Situation.
  - |
       Ось чому, хлопчики, я думаю, що [вам пощастило]Situation. Поліцейські б вас і без мене випустили, тільки не так скоро.
  - |
       Так йому вдалося краще відчути колорит того міста. Ось чому [фільм вийшов настільки цікавим]Situation.
  - |
       Ось чому [ніхто не бажав відповідати на мої дзвінки]Situation — адже у цей час якраз і вирішувалося, що ж робити далі зі мною.
