name: "VP як треба"
illustration: "Після ремонту все працює як треба"
cefr_level: A2
definitions:
  - ukrainian: |
       Конструкція позначає, що певна [дія]Action виконується за всіма правилами. У мовця є уявлення про певний стандарт, відповідно до якого, на його думку, має виконуватися ця дія.
  - english: |
       The construction indicates that a certain [action]Action is performed according to all established rules. The speaker has an idea of a certain standard according to which, in their opinion, this action should be carried out.
  - russian: |
       Конструкция обозначает, что некоторое [действие]Action выполняется по всем правилам. У говорящего есть представление об определенном стандарте, в соответствии с которым, по его мнению, должно выполняться это действие.
examples:
