  - |
       Після кількох невдалих спроб майстер нарешті [відрегулював]Action механізм як треба.
  - |
       Oрганізатори [провели]Action конференцію як треба, залучивши міжнародних спікерів.
  - |
       Хоча погода різко погіршилася, туристи [організували]Action табір як треба.
