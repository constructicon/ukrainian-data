name: "NP-Nom належати до числа NP-Gen"
illustration: "Ця компанія належить до числа лідерів ринку."
cefr_level: А1
definitions:
  - ukrainian: |
       Конструкція  використовується для позначення того, що певний [учасник]Theme є [членом, представником або частиною групи]Property. Вона вказує на належність або приналежність до певного колективу або класу.
  - english: |
       The construction  is used to indicate that a certain [participant]Theme is a member, representative, or part of a [group, category, or set]Property. It denotes belonging or affiliation to a particular collective or class.
  - russian: |
       Конструкция  используется для обозначения того, что определённый [участник]Theme является членом, представителем или частью [группы, категории или множества]Property. Она указывает на принадлежность к определённому коллективу или классу.
examples:
