name: "у (NP-Gen) бути NP-Nom"
illustration: "У мене є книга казок."
cefr_level: A1
definitions:
  - ukrainian: |
       Конструкція використовується для вираження володіння, наявності або доступності певного [об’єкта, ресурсу або властивості]Theme у [особи]Possessor. Конструкція показує, що певний елемент існує у розпорядженні особи.
  - english: |
       The construction is used to express possession, availability, or the presence of a certain [object, resource, or property]Theme with a [person]Possessor. The construction indicates that a certain element is at the disposal of the person.
  - russian: |
       Конструкция используется для выражения обладания, наличия или доступности определённого [объекта, ресурса или свойства]Theme у [лица]Possessor.
examples:
  - |
       У [мене]Possessor є [питання]Theme до міністра.
  - |
