name: "Cl, будь ласка"
illustration: "Будь ласкa, колеги, займайте свої місця!"
cefr_level: A1
definitions:
  - ukrainian: |
       Конструкція використовується для ввічливого прохання, пропозиції, дозволу на виконання [дії]Action або для привернення уваги до [ситуації]Situation. Конструкція не передбачає обов’язковості дії, а лише подає її як чемну, добровільну або соціально прийнятну.
  - english: |
       The construction is used to make a polite request, offer, or grant permission to perform an [Action], or to draw attention to a [Situation]. It does not imply that the action is obligatory; rather, it frames it as courteous, voluntary, or socially appropriate.
  - russian: |
       Конструкция используется для вежливого запроса, предложения или разрешения на выполнение [действия]Action, либо для привлечения внимания к [ситуации]Situation. Она не подразумевает обязательности действия, а представляет его как вежливое, добровольное или социально приемлемое.
examples:
