definitions:
  - ukrainian: |
       Конструкція використовується для вираження заборони або недопустимості виконання певної [дії або ситуації]Theme. Конструкція показує, що виконання цієї дії не дозволяється, вважається неправильним або забороненим у певних умовах.
  - english: |
       The construction is used to express the prohibition or unacceptability of performing a certain [action or situation]Theme. The construction indicates that performing the action is not allowed, considered inappropriate, or forbidden under certain conditions.
  - russian: |
       Конструкция используется для выражения запрета или недопустимости выполнения определённого [действия или ситуации]Theme. Конструкция показывает, что выполнение этого действия не разрешается, считается неправильным или запрещённым в определённых условиях.
examples:
